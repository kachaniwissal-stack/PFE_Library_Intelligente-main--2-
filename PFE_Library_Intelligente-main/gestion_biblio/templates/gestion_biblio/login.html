{% extends "gestion_biblio/base.html" %}

{% block content %}
<style>
    /* --- ستايل الزجاج العمودي أ وصال --- */
    .glass-auth-card {
        background: rgba(255, 255, 255, 0.1); 
        backdrop-filter: blur(25px); 
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 40px;
        padding: 50px;
        max-width: 450px;
        margin: 40px auto;
        box-shadow: 0 40px 100px -20px rgba(0,0,0,0.3);
        color: white;
        text-align: center;
    }

    .brand-icon-circle {
        width: 80px; height: 80px;
        background: rgba(74, 55, 51, 0.8); 
        color: white; border-radius: 25px;
        display: inline-flex; align-items: center; justify-content: center;
        margin-bottom: 30px;
        margin: 0 auto 30px
    }

    .form-group-custom {
        text-align: left; 
        width: 100%;
        margin-bottom: 25px;
    }

    .premium-label {
        display: block;
        font-weight: 700; 
        font-size: 0.85rem;
        margin-bottom: 10px; 
        margin-left: 15px;
        color: rgba(255,255,255,0.9);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .form-control-glass {
        background: rgba(239, 246, 255, 0.9) !important;
        border: none !important;
        border-radius: 50px !important;
        padding: 15px 25px !important;
        font-weight: 600;
        color: #1e293b !important;
        width: 100% !important;
        transition: 0.3s;
    }

    /* ستايل رابط نسيت كلمة المرور */
    .forgot-link {
        display: block;
        text-align: right;
        margin-top: -15px;
        margin-bottom: 20px;
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.6);
        text-decoration: none;
        transition: 0.3s;
        padding-right: 15px;
    }
    .forgot-link:hover {
        color: white;
        text-decoration: underline;
    }

    .btn-dark-premium {
        background: #2d1b17 !important;
        color: white !important;
        border: none;
        border-radius: 50px;
        padding: 16px;
        font-weight: 700;
        width: 100%;
        margin-top: 10px;
        transition: 0.4s;
    }
    .btn-dark-premium:hover { transform: scale(1.02); filter: brightness(1.2); }

    .reg-link { color: #d7ccc8; text-decoration: none; font-weight: 700; transition: 0.3s; }
    .reg-link:hover { color: white; }
</style>

<div class="container" data-aos="zoom-in">
    <div class="card glass-auth-card">
        <div class="brand-icon-circle">
            <i class="fas fa-fingerprint fa-2x"></i>
        </div>
        
        <h2 class="fw-bold mb-1">Connexion</h2>
        <p class="opacity-75 small mb-5">Accédez à votre bibliothèque intelligente</p>

        {% if form.errors %}
            <div class="alert alert-danger bg-danger text-white border-0 rounded-4 small mb-4">
                Identifiants incorrects.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group-custom">
                <label class="premium-label">Email d'utilisateur</label>
                <input type="email" name="username" class="form-control-glass" required>
            </div>

            <div class="form-group-custom">
                <label class="premium-label">Mot de passe</label>
                <div class="position-relative">
                    <input type="password" name="password" id="loginPass" class="form-control-glass"  required>
                    <i class="fas fa-eye-slash position-absolute" id="toggleLoginPass" 
                       style="right: 25px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748b;"></i>
                </div>
            </div>

            <!-- رابط نسيت كلمة المرور أ وصال -->
            <a href="{% url 'password_reset' %}" class="forgot-link">
                Mot de passe oublié ?
            </a>
            
            <button type="submit" class="btn btn-dark-premium shadow-lg">
                Se connecter <i class="fas fa-arrow-right ms-2"></i>
            </button>
        </form>

        <div class="mt-5">
            <p class="small opacity-75 mb-1">Pas encore de compte ?</p>
            <a href="{% url 'register' %}" class="reg-link">Créer un profil étudiant</a>
        </div>
    </div>
</div>

<script>
    const toggleBtn = document.querySelector('#toggleLoginPass');
    const passwordInput = document.querySelector('#loginPass');

    toggleBtn.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
    });
</script>
{% endblock %}
