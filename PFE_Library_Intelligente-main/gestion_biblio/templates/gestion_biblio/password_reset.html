{% extends "gestion_biblio/base.html" %}

{% block content %}
<style>
    /* نفس ستايل الزجاج اللي عندك */
    .glass-auth-card {
        background: rgba(255, 255, 255, 0.1); 
        backdrop-filter: blur(25px); 
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 40px;
        padding: 50px;
        max-width: 450px;
        margin: 40px auto;
        box-shadow: 0 40px 100px -20px rgba(0,0,0,0.3);
        color: white;
        text-align: center;
    }

    .brand-icon-circle {
        width: 80px; height: 80px;
        background: rgba(74, 55, 51, 0.8); 
        color: white; border-radius: 25px;
        display: inline-flex; align-items: center; justify-content: center;
        margin: 0 auto 30px
    }

    .form-group-custom { text-align: left; width: 100%; margin-bottom: 25px; }

    .premium-label {
        display: block; font-weight: 700; font-size: 0.85rem;
        margin-bottom: 10px; margin-left: 15px;
        color: rgba(255,255,255,0.9); text-transform: uppercase;
    }

    .form-control-glass {
        background: rgba(239, 246, 255, 0.9) !important;
        border: none !important; border-radius: 50px !important;
        padding: 15px 25px !important; font-weight: 600;
        color: #1e293b !important; width: 100% !important;
    }

    .btn-dark-premium {
        background: #2d1b17 !important; color: white !important;
        border: none; border-radius: 50px; padding: 16px;
        font-weight: 700; width: 100%; margin-top: 20px; transition: 0.4s;
    }
    .btn-dark-premium:hover { transform: scale(1.02); filter: brightness(1.2); }
</style>

<div class="container" data-aos="zoom-in">
    <div class="card glass-auth-card">
        <div class="brand-icon-circle">
            <i class="fas fa-key fa-2x"></i>
        </div>
        
        <h2 class="fw-bold mb-1">Réinitialisation</h2>
        <p class="opacity-75 small mb-5">Entrez votre email </p>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group-custom">
                <label class="premium-label">Email d'utilisateur</label>
                <input type="email" name="email" class="form-control-glass" placeholder="votre@email.com" required>
            </div>
            
            <button type="submit" class="btn btn-dark-premium shadow-lg">
                Envoyer le lien <i class="fas fa-paper-plane ms-2"></i>
            </button>
        </form>

        <div class="mt-4">
            <a href="{% url 'login' %}" class="small text-white-50 text-decoration-none">Retour à la connexion</a>
        </div>
    </div>
</div>
{% endblock %}
