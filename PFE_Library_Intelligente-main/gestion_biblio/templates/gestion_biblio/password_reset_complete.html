{% extends "gestion_biblio/base.html" %}

{% block content %}
<style>
    /* --- ستايل الزجاج الموحد أ وصال --- */
    .glass-auth-card {
        background: rgba(255, 255, 255, 0.1); 
        backdrop-filter: blur(25px); 
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 40px;
        padding: 60px 40px;
        max-width: 450px;
        margin: 60px auto;
        box-shadow: 0 40px 100px -20px rgba(0,0,0,0.4);
        color: white;
        text-align: center;
    }

    /* أيقونة النجاح */
    .success-icon-circle {
        width: 90px; height: 90px;
        background: rgba(74, 55, 51, 0.8); 
        color: #4ade80; /* لون أخضر خفيف للنجاح */
        border-radius: 30px;
        display: inline-flex; align-items: center; justify-content: center;
        margin-bottom: 30px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .btn-dark-premium {
        background: #2d1b17 !important;
        color: white !important;
        border: none;
        border-radius: 50px;
        padding: 16px 40px;
        font-weight: 700;
        width: 100%;
        margin-top: 20px;
        transition: 0.4s;
        text-decoration: none;
        display: inline-block;
    }
    .btn-dark-premium:hover { 
        transform: scale(1.03); 
        filter: brightness(1.2); 
    }
</style>

<div class="container" data-aos="zoom-in">
    <div class="card glass-auth-card">
        <!-- أيقونة النجاح -->
        
        
        <h2 class="fw-bold mb-3">Succès !</h2>
        
        <p class="opacity-75 mb-5" style="font-size: 1.1rem; line-height: 1.6;">
            Votre mot de passe a été modifié avec succès. <br>
            Vous pouvez maintenant vous connecter à votre espace.
        </p>

        <!-- زر الرجوع للـ Login -->
        <a href="{% url 'login' %}" class="btn-dark-premium shadow-lg">
            Se connecter <i class="fas fa-sign-in-alt ms-2"></i>
        </a>
    </div>
</div>
{% endblock %}
