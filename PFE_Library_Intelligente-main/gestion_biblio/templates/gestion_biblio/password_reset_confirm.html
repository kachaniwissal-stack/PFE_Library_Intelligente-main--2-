{% extends "gestion_biblio/base.html" %}

{% block content %}
<style>
    /* ستايل الزجاج */
    .glass-auth-card {
        background: rgba(255, 255, 255, 0.1); 
        backdrop-filter: blur(25px); 
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 40px;
        padding: 50px;
        max-width: 450px;
        margin: 40px auto;
        color: white;
        text-align: center;
    }

    .form-group-custom { text-align: left; width: 100%; margin-bottom: 25px; }

    .premium-label {
        display: block; font-weight: 700; font-size: 0.8rem;
        margin-bottom: 10px; margin-left: 15px;
        color: rgba(255,255,255,0.9); text-transform: uppercase;
    }

    .form-control-glass {
        background: rgba(239, 246, 255, 0.9) !important;
        border: none !important; border-radius: 50px !important;
        padding: 15px 25px !important; font-weight: 600;
        color: #1e293b !important; width: 100% !important;
    }

    .btn-dark-premium {
        background: #2d1b17 !important; color: white !important;
        border: none; border-radius: 50px; padding: 16px;
        font-weight: 700; width: 100%; margin-top: 15px; transition: 0.4s;
    }
</style>

<div class="container" data-aos="zoom-in">
    <div class="card glass-auth-card">
        <h2 class="fw-bold mb-2">Nouveau mot de passe</h2>
        <p class="opacity-75 small mb-5">Définissez votre nouveau code d'accès</p>

        <form method="POST">
            {% csrf_token %}
            
            {% for field in form %}
                <div class="form-group-custom">
                    <label class="premium-label">
                        {% if forloop.first %} Nouveau mot de passe {% else %} Confirmation {% endif %}
                    </label>
                    
                    <div class="position-relative">
                        <!-- عطينا id ديناميكي لكل خانة باش نتحكمو فيها -->
                        <input type="password" name="{{ field.name }}" id="pass_{{ forloop.counter }}" 
                               class="form-control-glass"  required>
                        
                        <!-- العوينة السحرية -->
                        <i class="fas fa-eye-slash position-absolute toggle-password" 
                           data-target="pass_{{ forloop.counter }}"
                           style="right: 25px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748b;"></i>
                    </div>
                    
                    {% if field.errors %}
                        <div class="text-danger small mt-1 ms-3">{{ field.errors.0 }}</div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-dark-premium shadow-lg">
                Changer le mot de passe
            </button>
        </form>
    </div>
</div>

<script>
    // هاد السكريبت غايخدم لكل العوينات اللي في الصفحة
    document.querySelectorAll('.toggle-password').forEach(icon => {
        icon.addEventListener('click', function() {
            const targetId = this.getAttribute('data-target');
            const input = document.getElementById(targetId);
            
            // تبديل النوع
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            
            // تبديل شكل العين
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    });
</script>
{% endblock %}
