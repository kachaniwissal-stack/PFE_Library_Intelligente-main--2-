{% extends "gestion_biblio/base.html" %}

{% block content %}
<style>
    /* ستايل الزجاج */
    .glass-auth-card {
        background: rgba(255, 255, 255, 0.1); 
        backdrop-filter: blur(25px); 
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 40px;
        padding: 50px;
        max-width: 450px;
        margin: 40px auto;
        box-shadow: 0 40px 100px -20px rgba(0,0,0,0.3);
        color: white;
        text-align: center;
    }

    .brand-icon-circle {
        width: 80px; height: 80px;
        background: rgba(74, 55, 51, 0.8); 
        color: white; border-radius: 25px;
        display: inline-flex; align-items: center; justify-content: center;
        margin: 0 auto 30px
    }

    .btn-outline-custom {
        border: 2px solid rgba(255,255,255,0.5);
        color: white;
        border-radius: 50px;
        padding: 12px 30px;
        text-decoration: none;
        font-weight: 600;
        transition: 0.3s;
        display: inline-block;
    }
    .btn-outline-custom:hover {
        background: white;
        color: #2d1b17;
    }
</style>

<div class="container" data-aos="zoom-in">
    <div class="card glass-auth-card">
        <div class="brand-icon-circle">
            <i class="fas fa-envelope-open-text fa-2x"></i>
        </div>
        
        <h2 class="fw-bold mb-3">E-mail envoyé</h2>
        
        <!-- النص بالفرنسية أ وصال -->
        <p class="opacity-75 mb-5" style="line-height: 1.6;">
            Un lien de réinitialisation vous a été envoyé par e-mail. <br>
            Veuillez vérifier votre boîte de réception.
        </p>

        <div class="mt-2">
            <a href="{% url 'login' %}" class="btn-outline-custom">
                Retour au login
            </a>
        </div>
    </div>
</div>
{% endblock %}
